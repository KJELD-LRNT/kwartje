{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<article class="narrow">
  <h1>Inloggen</h1>
  {% if let Some(e) = error %}<p class="flash flash-error" role="alert">{{ e }}</p>{% endif %}
  <form method="post" action="/inloggen">
    <input type="hidden" name="csrf_token" value="{{ l.csrf }}">
    <label>E-mailadres
      <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    </label>
    <label>Wachtwoord
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <label>
      <input type="checkbox" name="remember" value="1"{% if remember %} checked{% endif %}>
      Ingelogd blijven (7 dagen)
    </label>
    <small class="muted">Alleen op je eigen apparaat. Zonder vinkje word je na 12 uur zonder activiteit uitgelogd.</small>
    <button type="submit">Inloggen</button>
  </form>
</article>
{% endblock %}
